name: Daily PAM Pulse

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Record transparent daily pulse
        run: python scripts/refresh_snapshot.py --heartbeat-only
      - name: Validate generated state
        run: python scripts/validate_data.py
      - name: Build the freshly generated dashboard
        run: python scripts/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload fresh Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Commit generated pulse
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: record daily pulse"
          git push

  deploy:
    needs: pulse
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the same artifact generated by the pulse
        id: deployment
        uses: actions/deploy-pages@v4
